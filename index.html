<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Invitación: Ixi & Ricardo</title>
    <!-- Sin CSS/JS externos ni imágenes: carga inmediata en datos móviles -->
    <style>
        :root { --dark-purple:#503459; --mid-purple:#81638b; --paper:#fcfaf7; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: linear-gradient(160deg, #c5cad3 0%, #d8dde6 45%, #b9c0cc 100%);
            color: var(--dark-purple);
            font-family: Georgia, "Times New Roman", serif;
        }
        .paper-canvas {
            width: 100%;
            max-width: 36rem;
            background: var(--paper);
            padding: 2.5rem 1.5rem;
            border: 10px solid #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,.18);
            text-align: center;
        }
        @media (min-width:768px) {
            .paper-canvas { padding: 4rem 3.5rem; border-width: 16px; max-width: 42rem; }
        }
        .tag { text-transform: uppercase; letter-spacing: .25em; font-size: .75rem; color: #666F88; font-weight: 700; margin: 0 0 1rem; }
        .ornament { color: var(--mid-purple); font-size: 2rem; margin: .5rem 0 1rem; }
        h1 {
            font-size: clamp(2.5rem, 11vw, 4.5rem);
            line-height: 1.05;
            margin: 0 0 .75rem;
        }
        .subtitle {
            font-family: "Segoe Script", "Brush Script MT", cursive;
            font-size: clamp(2rem, 8vw, 3.25rem);
            color: var(--mid-purple);
            margin: 0 0 2.5rem;
        }
        .invite-link {
            display: block;
            text-decoration: none;
            color: inherit;
            padding-top: 1rem;
            -webkit-tap-highlight-color: transparent;
        }
        .press { font-size: .7rem; text-transform: uppercase; letter-spacing: .3em; color: #788199; font-weight: 700; margin: 0 0 1rem; }
        .wax-seal {
            width: 85px; height: 85px; margin: 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle, #81638b 0%, #503459 100%);
            color: #fff; font-weight: 700; font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 3px 3px 10px rgba(0,0,0,.3);
        }
        .ver {
            margin-top: 1rem;
            font-family: "Segoe Script", "Brush Script MT", cursive;
            font-size: 2rem;
            color: var(--mid-purple);
        }
    </style>
</head>

<body>
    <main class="paper-canvas">
        <p class="tag">Uniendo nuestras vidas</p>
        <div class="ornament">❦</div>
        <h1>Ixi & Ricardo</h1>
        <p class="subtitle">Nuestra Boda</p>

        <a href="invitacionv2.html" class="invite-link">
            <p class="press">Presiona aquí</p>
            <div class="wax-seal">I&R</div>
            <p class="ver">Ver Invitación</p>
        </a>
    </main>
</body>

</html>
