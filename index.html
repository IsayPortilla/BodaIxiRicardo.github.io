<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación: Ixi & Ricardo</title>
    <style>
        :root {
            --dark-purple: #503459;
            --mid-purple: #81638b;
            --steel-blue: #666F88;
            --paper-color: #fcfaf7;
        }

        body {
            background-color: #d1d5db;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--dark-purple);
            margin: 0;
        }

        .paper-canvas {
            background-color: var(--paper-color);
            background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.7), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(129,99,139,0.08), transparent 45%);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2), inset 0 0 100px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            z-index: 1;
            max-width: 56rem;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            padding: 2.5rem;
            border: 16px solid white;
        }

        .flower {
            position: absolute;
            z-index: 0;
            pointer-events: none;
            opacity: 0.9;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.1));
        }

        .flower-tl {
            top: 10px;
            left: 10px;
            width: 320px;
            transform: rotate(0deg);
        }

        .flower-tr {
            top: 5px;
            right: 5px;
            width: 300px;
            transform: rotate(0deg);
        }

        .flower-bl {
            bottom: 0px;
            left: 0px;
            width: 300px;
            transform: rotate(-180deg);
        }

        .flower-br {
            bottom: 20px;
            right: 20px;
            width: 320px;
            transform: rotate(180deg);
        }

        @media (max-width: 768px) {
            .flower {
                width: 160px;
            }

            .paper-canvas {
                padding: 1.75rem 1.25rem;
                border-width: 10px;
            }

            .hero-name {
                font-size: clamp(2.5rem, 12vw, 4.5rem);
                line-height: 1.05;
            }

            .hero-subtitle {
                font-size: clamp(2.5rem, 10vw, 3.5rem);
            }

            .hero-tagline {
                letter-spacing: clamp(0.12em, 1.5vw, 0.5em);
                font-size: 0.75rem;
            }
        }

        @media (min-width: 768px) {
            .paper-canvas {
                padding: 6rem;
            }
            .md\:p-10 { padding: 2.5rem; }
            .md\:text-lg { font-size: 1.125rem; }
        }

        .playfair {
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 700;
        }

        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .min-h-screen { min-height: 100vh; }
        .p-4 { padding: 1rem; }
        .text-center { text-align: center; }
        .space-y-10 > * + * { margin-top: 2.5rem; }
        .relative { position: relative; }
        .z-10 { z-index: 10; }
        .absolute { position: absolute; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .bottom-0 { bottom: 0; }
        .right-0 { right: 0; }
        .w-24 { width: 6rem; }
        .h-24 { height: 6rem; }
        .m-8 { margin: 2rem; }
        .border-t-2 { border-top: 2px solid; }
        .border-l-2 { border-left: 2px solid; }
        .border-b-2 { border-bottom: 2px solid; }
        .border-r-2 { border-right: 2px solid; }
        .border-\[\#b5bac9\] { border-color: #b5bac9; }
        .uppercase { text-transform: uppercase; }
        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-5 { margin-bottom: 1.25rem; }
        .mt-5 { margin-top: 1.25rem; }
        .pt-12 { padding-top: 3rem; }
        .text-xs { font-size: 0.75rem; }
        .text-base { font-size: 1rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-\[\#666F88\] { color: #666F88; }
        .text-\[\#788199\] { color: #788199; }
        .text-\[\#81638b\] { color: #81638b; }
        .tracking-\[0\.3em\] { letter-spacing: 0.3em; }
        .tracking-\[0\.5em\] { letter-spacing: 0.5em; }

        .name-focus {
            animation: tracking-in-expand 1.5s cubic-bezier(0.215, 0.610, 0.355, 1.000) both;
        }

        @keyframes tracking-in-expand {
            0% {
                letter-spacing: -0.2em;
                opacity: 0;
            }

            40% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        .serif-script {
            font-family: "Segoe Script", "Brush Script MT", cursive;
        }

        .birthstone {
            font-family: "Segoe Script", "Brush Script MT", cursive;
            font-weight: 500;
        }

        .invite-link {
            display: block;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: opacity 0.25s ease;
        }

        .invite-link:hover {
            opacity: 0.92;
        }

        .wax-seal {
            background: radial-gradient(circle, #81638b 0%, #503459 100%);
            width: 85px;
            height: 85px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.3);
            margin: 0 auto;
            position: relative;
            z-index: 10;
            transition: transform 0.3s;
        }

        .invite-link:hover .wax-seal {
            transform: scale(1.1) rotate(5deg);
        }

        .wax-seal span {
            font-family: Georgia, serif;
            font-weight: 700;
            font-size: 1.6rem;
            line-height: 1;
            display: block;
            margin-top: -2px;
        }

        .ornament {
            color: var(--mid-purple);
            font-size: 2.5rem;
            margin: 1rem 0;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 md:p-10">

    <main class="paper-canvas">

        <img src="assets/img/flor1.png" class="flower flower-tl animate__animated animate__fadeIn" alt="" loading="lazy" decoding="async">
        <img src="assets/img/flor3.png" class="flower flower-tr animate__animated animate__fadeIn" alt="" loading="lazy" decoding="async">
        <img src="assets/img/flor3.png" class="flower flower-bl animate__animated animate__fadeIn" alt="" loading="lazy" decoding="async">
        <img src="assets/img/flor1.png" class="flower flower-br animate__animated animate__fadeIn" alt="" loading="lazy" decoding="async">

        <div class="absolute top-0 left-0 w-24 h-24 border-t-2 border-l-2 border-[#b5bac9] m-8 z-10"></div>
        <div class="absolute bottom-0 right-0 w-24 h-24 border-b-2 border-r-2 border-[#b5bac9] m-8 z-10"></div>

        <div class="text-center space-y-10 relative z-10">
            <p
                class="hero-tagline uppercase tracking-[0.5em] text-base md:text-lg text-[#666F88] animate__animated animate__fadeInDown animate__delay-1s font-semibold px-2">
                Uniendo nuestras vidas
            </p>

            <div class="ornament">❦</div>

            <div class="py-6 px-2">
                <h1 class="hero-name text-7xl md:text-9xl playfair name-focus mb-4">Ixi & Ricardo</h1>
                <p
                    class="hero-subtitle serif-script text-5xl md:text-7xl text-[#81638b] animate__animated animate__fadeIn animate__delay-2s">
                    Nuestra Boda
                </p>
            </div>

            <!-- <link rel="preconnect" href="https://fonts.googleapis.com">

            <a href="invitacionv2.html"
                class="invite-link pt-12 animate__animated animate__zoomIn animate__delay-3s text-center">
                <p class="mb-5 text-xs uppercase tracking-[0.3em] text-[#788199] font-bold">
                    Presiona aquí
                </p>

                <div class="wax-seal" aria-hidden="true">
                    <span>I&R</span>
                </div>

                <p class="mt-5 text-[#81638b] birthstone text-4xl">
                    Ver Invitación
                </p>
            </a>

        </div>
    </main>

    <script>
        // Fuentes y animaciones solo si hay buena conexión (WiFi / 4G estable)
        (function () {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const slow = conn && (conn.saveData || /2g/i.test(conn.effectiveType || ""));
            if (slow) return;

            const font = document.createElement("link");
            font.rel = "stylesheet";
            font.href = "https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Pinyon+Script&family=Birthstone+Bounce:wght@400;500&display=swap";
            document.head.appendChild(font);

            font.onload = function () {
                document.body.style.fontFamily = "'Quicksand', sans-serif";
                document.querySelectorAll(".playfair").forEach(el => el.style.fontFamily = "'Playfair Display', serif");
                document.querySelectorAll(".serif-script").forEach(el => el.style.fontFamily = "'Pinyon Script', cursive");
                document.querySelectorAll(".birthstone").forEach(el => el.style.fontFamily = "'Birthstone Bounce', cursive");
                document.querySelectorAll(".wax-seal span").forEach(el => {
                    el.style.fontFamily = "'Birthstone Bounce', cursive";
                    el.style.fontSize = "2.2rem";
                });
            };
        })();
    </script>
</body>

</html>
