<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Mensajes | Ixi & Ricardo</title>
    <link rel="stylesheet" href="css/enviar-mensajes.css">
</head>

<body>
    <div class="wrap">

        <section class="card toolbar">
            <p id="loadStatus" class="status-text">Cargando datos...</p>
            <div class="toolbar-actions">
                <button type="button" id="reloadBtn" class="btn-secondary">↻ Recargar</button>
                <button type="button" id="clearSentBtn" class="btn-secondary">Limpiar enviados</button>
            </div>
            <div class="target-row" role="group" aria-label="Dónde abrir WhatsApp">
                <span class="target-label">Enviar a:</span>
                <label class="target-opt"><input type="radio" name="waTarget" value="desktop"> App de escritorio</label>
                <label class="target-opt"><input type="radio" name="waTarget" value="web"> WhatsApp Web</label>
            </div>
            <p class="hint-text">El mensaje se copia y se escribe solo en el chat (igual que en el celular). En la PC elige <strong>App de escritorio</strong> o <strong>WhatsApp Web</strong>. Luego pulsa Enviar en WhatsApp.</p>
        </section>

        <section class="stats" id="statsBar">
            <div class="card" style="text-align:center">
                <p class="stat-num stat-total" id="statTotal">0</p>
                <p class="stat-label">Familias</p>
            </div>
            <div class="card" style="text-align:center">
                <p class="stat-num stat-ready" id="statReady">0</p>
                <p class="stat-label">Listas</p>
            </div>
            <div class="card" style="text-align:center">
                <p class="stat-num stat-incomplete" id="statIncomplete">0</p>
                <p class="stat-label">Incompletas</p>
            </div>
            <div class="card" style="text-align:center">
                <p class="stat-num stat-sent" id="statSent">0</p>
                <p class="stat-label">Enviadas</p>
            </div>
        </section>

        <section class="card">
            <input type="search" id="searchInput" class="input-field" placeholder="Buscar familia...">
        </section>

        <section id="familiesList" class="family-list">
            <p class="loader">Cargando familias...</p>
        </section>

    </div>
    <script src="js/sheet.js" defer></script>
    <script src="js/enviar-mensajes.js" defer></script>
</body>

</html>
